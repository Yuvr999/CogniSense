version: '3.8'

services:
  # Backend API Service
  backend:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

  # Clinician Dashboard Service
  clinician-dashboard:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run frontend/streamlit/Home.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - backend
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
