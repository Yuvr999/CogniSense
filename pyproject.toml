[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "cognisense"
version = "0.1.0"
description = "CogniSense - Multimodal Digital Biomarker Screening for Early Alzheimer's / MCI"
authors = ["Antigravity Agent <agent@example.com>"]
packages = [{include = "cognisense", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pydantic = "^2.0.0"
pandera = "^0.18.0"
pytest = "^7.4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
